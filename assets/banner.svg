<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d172b"/><stop offset="1" stop-color="#102b4a"/></linearGradient><linearGradient id="line"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs>
<rect width="1000" height="270" rx="22" fill="url(#bg)"/>
<g stroke="#ffffff" opacity=".035"><path d="M620 40v190m60-190v190m60-190v190m60-190v190m60-190v190m60-190v190M600 70h350M600 120h350M600 170h350M600 220h350"/></g>
<rect x="46" y="45" width="248" height="28" rx="14" fill="#38bdf8" fill-opacity=".12"/>
